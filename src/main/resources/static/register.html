<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Online Exam System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="card-custom">
    <h3 class="text-center mb-4">Create Account</h3>
    <div id="message" class="alert d-none"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select class="form-select" id="role">
                <option value="STUDENT">Student</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="text-center mt-3">Already have an account? <a href="login.html">Login here</a></p>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            role: document.getElementById("role").value
        };

        const response = await apiPost("/users/register", data);
        const text = await response.text();

        const msgDiv = document.getElementById("message");
        msgDiv.classList.remove("d-none");

        if (response.ok) {
            msgDiv.classList.add("alert-success");
            msgDiv.classList.remove("alert-danger");
            msgDiv.innerText = text + " Redirecting to login...";
            setTimeout(() => window.location.href = "login.html", 1500);
        } else {
            msgDiv.classList.add("alert-danger");
            msgDiv.classList.remove("alert-success");
            msgDiv.innerText = text;
        }
    });
</script>
</body>
</html>
