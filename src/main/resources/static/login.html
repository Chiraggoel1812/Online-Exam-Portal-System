<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Online Exam System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="card-custom">
    <h3 class="text-center mb-4">Login</h3>
    <div id="message" class="alert alert-danger d-none"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-center mt-3">New here? <a href="register.html">Register</a></p>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        localStorage.setItem("email", email);
        localStorage.setItem("password", password);

        try {
             const response = await fetch(BASE_URL + "/users/login", {
               method: "POST",
                headers: {
            "Content-Type": "application/json"
             },
              body: JSON.stringify({ email, password })
        });

            const text = await response.text();
            const msgDiv = document.getElementById("message");

            if (response.ok && text.includes("successful")) {
                const role = text.split("Role: ")[1];
                localStorage.setItem("role", role);

                const users = await apiGet("/users");
                const currentUser = users.find(u => u.email === email);
                if (currentUser) {
                    localStorage.setItem("userId", currentUser.id);
                }

                if (role === "ADMIN") {
                    window.location.href = "admin-dashboard.html";
                } else {
                    window.location.href = "student-dashboard.html";
                }
            } else {
                localStorage.clear();
                msgDiv.classList.remove("d-none");
                msgDiv.innerText = text;
            }
        } catch (err) {
            localStorage.clear();
            document.getElementById("message").classList.remove("d-none");
            document.getElementById("message").innerText = "Login failed. Try again.";
        }
    });
</script>
</body>
</html>
