<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Online Exam System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="card-custom">
    <h3 class="text-center mb-4">Login</h3>
    <div id="message" class="alert d-none"></div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <p class="text-center mt-3">Don't have an account? <a href="register.html">Register here</a></p>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        const msgDiv = document.getElementById("message");
        msgDiv.classList.remove("d-none");

        try {
            const response = await apiPost("/users/login", data);
            const result = await response.json();

            if (response.ok) {
                msgDiv.classList.add("alert-success");
                msgDiv.classList.remove("alert-danger");
                msgDiv.innerText = "Login successful! Redirecting...";
                
                // Role ke hisab se redirect karo
                setTimeout(() => {
                    if (result.role === "ADMIN") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "student-dashboard.html";
                    }
                }, 1000);
            } else {
                msgDiv.classList.add("alert-danger");
                msgDiv.classList.remove("alert-success");
                msgDiv.innerText = result.error || "Invalid email or password";
            }
        } catch (err) {
            msgDiv.classList.add("alert-danger");
            msgDiv.classList.remove("alert-success");
            msgDiv.innerText = "Login failed. Please check your credentials.";
        }
    });
</script>
</body>
</html>
