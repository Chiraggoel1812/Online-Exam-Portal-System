<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Online Exam System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-custom navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand">Online Exam System - Admin</span>
        <div>
            <span class="text-white me-3" id="welcomeText"></span>
            <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Create Exam Section -->
    <div class="question-box">
        <h4>Create New Exam</h4>
        <form id="examForm" class="row g-3 mt-2">
            <div class="col-md-4">
                <label class="form-label">Exam Name</label>
                <input type="text" class="form-control" id="examName" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Duration (minutes)</label>
                <input type="number" class="form-control" id="duration" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Total Marks</label>
                <input type="number" class="form-control" id="totalMarks" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
                <button type="submit" class="btn btn-primary w-100">Create Exam</button>
            </div>
        </form>
    </div>

    <!-- Exams List -->
    <div class="question-box">
        <h4>All Exams</h4>
        <table class="table table-bordered mt-3">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Exam Name</th>
                <th>Duration</th>
                <th>Total Marks</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="examTableBody"></tbody>
        </table>
    </div>

    <!-- Add Question Section -->
    <div class="question-box">
        <h4>Add Question</h4>
        <form id="questionForm" class="mt-2">
            <div class="mb-3">
                <label class="form-label">Select Exam</label>
                <select class="form-select" id="questionExamSelect" required></select>
            </div>
            <div class="mb-3">
                <label class="form-label">Question Text</label>
                <textarea class="form-control" id="questionText" required></textarea>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Option A</label>
                    <input type="text" class="form-control" id="optionA" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Option B</label>
                    <input type="text" class="form-control" id="optionB" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Option C</label>
                    <input type="text" class="form-control" id="optionC" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Option D</label>
                    <input type="text" class="form-control" id="optionD" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Correct Answer</label>
                    <select class="form-select" id="correctAnswer">
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Add Question</button>
        </form>
    </div>

    <!-- Questions List -->
    <div class="question-box mb-5">
        <h4>Questions for Selected Exam</h4>
        <select class="form-select mb-3" id="viewExamSelect" onchange="loadQuestionsForView()"></select>
        <table class="table table-bordered">
            <thead class="table-dark">
            <tr>
                <th>Question</th>
                <th>Correct Answer</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="questionTableBody"></tbody>
        </table>
    </div>

</div>

<script src="js/api.js"></script>
<script>
    if (!isLoggedIn()) {
        window.location.href = "login.html";
    }

    document.getElementById("welcomeText").innerText =
        "Logged in as: " + localStorage.getItem("email");

    // ---------- EXAMS ----------

    async function loadExams() {
        const exams = await apiGet("/exams");

        const tbody = document.getElementById("examTableBody");
        tbody.innerHTML = "";

        const questionExamSelect = document.getElementById("questionExamSelect");
        const viewExamSelect = document.getElementById("viewExamSelect");
        questionExamSelect.innerHTML = "";
        viewExamSelect.innerHTML = "";

        exams.forEach(exam => {
            // Table row
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${exam.id}</td>
                <td>${exam.examName}</td>
                <td>${exam.duration} min</td>
                <td>${exam.totalMarks}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="deleteExam(${exam.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(row);

            // Dropdown options
            const option1 = document.createElement("option");
            option1.value = exam.id;
            option1.innerText = exam.examName;
            questionExamSelect.appendChild(option1);

            const option2 = document.createElement("option");
            option2.value = exam.id;
            option2.innerText = exam.examName;
            viewExamSelect.appendChild(option2);
        });

        if (exams.length > 0) {
            loadQuestionsForView();
        }
    }

    document.getElementById("examForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const data = {
            examName: document.getElementById("examName").value,
            duration: parseInt(document.getElementById("duration").value),
            totalMarks: parseInt(document.getElementById("totalMarks").value)
        };

        const response = await apiPost("/exams", data);

        if (response.ok) {
            alert("Exam created successfully!");
            document.getElementById("examForm").reset();
            loadExams();
        } else {
            alert("Failed to create exam.");
        }
    });

    async function deleteExam(id) {
        if (!confirm("Are you sure? This will also affect related questions.")) return;

        const response = await apiDelete("/exams/" + id);
        if (response.ok) {
            loadExams();
        } else {
            alert("Failed to delete exam.");
        }
    }

    // ---------- QUESTIONS ----------

    document.getElementById("questionForm").addEventListener("submit", async function (e) {
        e.preventDefault();

        const examId = document.getElementById("questionExamSelect").value;

        const data = {
            exam: { id: parseInt(examId) },
            questionText: document.getElementById("questionText").value,
            optionA: document.getElementById("optionA").value,
            optionB: document.getElementById("optionB").value,
            optionC: document.getElementById("optionC").value,
            optionD: document.getElementById("optionD").value,
            correctAnswer: document.getElementById("correctAnswer").value
        };

        const response = await apiPost("/questions", data);

        if (response.ok) {
            alert("Question added successfully!");
            document.getElementById("questionForm").reset();
            loadQuestionsForView();
        } else {
            alert("Failed to add question.");
        }
    });

    async function loadQuestionsForView() {
        const examId = document.getElementById("viewExamSelect").value;
        if (!examId) return;

        const questions = await apiGet("/questions/exam/" + examId);
        const tbody = document.getElementById("questionTableBody");
        tbody.innerHTML = "";

        questions.forEach(q => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${q.questionText}</td>
                <td>${q.correctAnswer}</td>
                <td>
                    <button class="btn btn-sm btn-danger" onclick="deleteQuestion(${q.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function deleteQuestion(id) {
        if (!confirm("Delete this question?")) return;

        const response = await apiDelete("/questions/" + id);
        if (response.ok) {
            loadQuestionsForView();
        } else {
            alert("Failed to delete question.");
        }
    }

    loadExams();
</script>
</body>
</html>
