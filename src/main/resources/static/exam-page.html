<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam - Online Exam System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-custom navbar-expand-lg">
    <div class="container">
        <span class="navbar-brand" id="examTitle">Exam</span>
        <span id="timer">30:00</span>
    </div>
</nav>

<div class="container">
    <div id="quizContainer" class="question-box">
        <h6 class="text-muted" id="questionCounter">Question 1 of 5</h6>
        <h4 id="questionText" class="mb-4"></h4>

        <div id="optionsContainer"></div>

        <div class="d-flex justify-content-between mt-4">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">Previous</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next</button>
            <button class="btn btn-success d-none" id="submitBtn" onclick="submitExam()">Submit Exam</button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script>
    if (!isLoggedIn()) {
        window.location.href = "login.html";
    }

    const examId = localStorage.getItem("currentExamId");
    let questions = [];
    let currentIndex = 0;
    let userAnswers = {};   // { questionId: "A"/"B"/"C"/"D" }
    let timeLeft = 0;
    let timerInterval;
    // Fisher-Yates shuffle algorithm - array ko randomly mix karta hai
       function shuffleArray(array) {
    const arr = [...array];   // original array ko change na karke copy banao
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

    // Exam details aur questions dono load karo
    async function initExam() {
        try {
            const exam = await apiGet("/exams/" + examId);
            document.getElementById("examTitle").innerText = exam.examName;
            timeLeft = exam.duration * 60;   // minutes ko seconds mein convert karo

            questions = await apiGet("/questions/exam/" + examId);

            if (questions.length === 0) {
                alert("No questions found for this exam.");
                window.location.href = "student-dashboard.html";
                return;
            }
            questions = shuffleArray(questions);

            startTimer();
            renderQuestion();
        } catch (err) {
            console.error("Error loading exam:", err);
            alert("Failed to load exam.");
        }
    }

    // Timer start karo
    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting your exam automatically.");
                submitExam();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        document.getElementById("timer").innerText =
            `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    // Current question render karo
    function renderQuestion() {
        const q = questions[currentIndex];
        document.getElementById("questionCounter").innerText =
            `Question ${currentIndex + 1} of ${questions.length}`;
        document.getElementById("questionText").innerText = q.questionText;

        const optionsDiv = document.getElementById("optionsContainer");
        optionsDiv.innerHTML = "";

        const options = [
            { key: "A", text: q.optionA },
            { key: "B", text: q.optionB },
            { key: "C", text: q.optionC },
            { key: "D", text: q.optionD }
        ];

        options.forEach(opt => {
            const isChecked = userAnswers[q.id] === opt.key ? "checked" : "";
            const label = document.createElement("label");
            label.className = "option-label";
            label.innerHTML = `
                <input type="radio" name="option" value="${opt.key}" ${isChecked}
                    onchange="selectAnswer('${opt.key}')"> ${opt.key}) ${opt.text}
            `;
            optionsDiv.appendChild(label);
        });

        // Previous button disable karo pehle question pe
        document.getElementById("prevBtn").disabled = currentIndex === 0;

        // Last question pe Next chhupao, Submit dikhao
        if (currentIndex === questions.length - 1) {
            document.getElementById("nextBtn").classList.add("d-none");
            document.getElementById("submitBtn").classList.remove("d-none");
        } else {
            document.getElementById("nextBtn").classList.remove("d-none");
            document.getElementById("submitBtn").classList.add("d-none");
        }
    }

    function selectAnswer(option) {
        const q = questions[currentIndex];
        userAnswers[q.id] = option;
    }

    function nextQuestion() {
        if (currentIndex < questions.length - 1) {
            currentIndex++;
            renderQuestion();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    // Exam submit karo
    async function submitExam() {
        clearInterval(timerInterval);

        const userId = localStorage.getItem("userId");

        const payload = {
            userId: parseInt(userId),
            examId: parseInt(examId),
            answers: userAnswers
        };

        try {
            const response = await apiPost("/results/submit", payload);
            const result = await response.json();

            localStorage.setItem("lastResult", JSON.stringify(result));
            window.location.href = "result.html";
        } catch (err) {
            console.error("Error submitting exam:", err);
            alert("Failed to submit exam.");
        }
    }

    initExam();
</script>
</body>
</html>
